<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>坂、見えてますよ - AR Terrain Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0b0f19;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            cursor: grab;
        }

        #webgl-canvas:active {
            cursor: grabbing;
        }

        /* スマホベゼル・フレームのスタイリング */
        .phone-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(340px, 85vw);
            height: min(680px, 78vh);
            z-index: 10;
            pointer-events: none; /* 下層のCanvas操作を通過させる */
            box-sizing: border-box;
            border-radius: 48px;
            
            /* 背景を透明にし、borderでベゼルを表現（背後のScissor描画を透過させる） */
            background-color: transparent;
            border: 16px solid #1a1c20;
            
            box-shadow: 0 25px 60px rgba(0,0,0,0.6),
                        0 0 0 2px rgba(255,255,255,0.1),
                        inset 0 0 0 2px rgba(0,0,0,0.8),
                        inset 0 0 0 6px #1a1c20; /* Scissorの四角い角のはみ出しを隠すためのインナーマスク */
        }

        /* スマホ画面部分（透明。この背後にWebGLの第2パスが描画される） */
        .phone-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 30px; /* ベゼル内側の丸み */
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 255, 102, 0.15);
        }

        /* Dynamic Island / Notch */
        .phone-notch {
            position: absolute;
            top: -2px; /* borderに密着させる */
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 24px;
            background-color: #1a1c20;
            border-radius: 0 0 20px 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.5);
        }

        .phone-notch::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #0d1b2a;
            border: 1px solid #1e3a8a;
        }

        /* AR HUD オーバーレイ要素 */
        .ar-hud-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0,255,102,0.8), transparent);
            animation: scanline 3s infinite linear;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { top: 0%; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .ar-grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,255,102,0.1) 100%),
                linear-gradient(rgba(0, 255, 102, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            pointer-events: none;
        }

        /* Glassmorphism Panels */
        #feature-panel {
            position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
            width: 224px; z-index: 30;
            font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
            background: #fdf6ea; color: #5c4a38;
            border: 1px solid #ecd9bd; border-radius: 22px;
            box-shadow: 0 10px 30px rgba(90, 60, 20, .18);
            padding: 18px;
            font-size: 12px;
        }
        @media (max-width: 640px) {
            #feature-panel {
                left: auto; right: 8px; top: 8px; bottom: auto; transform: none;
                width: 168px; padding: 10px 12px; font-size: 11px; border-radius: 14px;
            }
            #feature-panel .ttl { font-size: 12px; margin-bottom: 4px; }
            #feature-panel button { padding: 5px 0; font-size: 11px; }
            #feature-panel a.pf { padding: 6px 0; font-size: 11px; margin-top: 5px; }
            #feature-panel hr { margin: 8px 0; }
            #feature-panel .credit { font-size: 10px; line-height: 1.4; }
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="w-full h-screen overflow-hidden">

    <!-- 全画面 3D Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- ヘッダー / アプリタイトル -->
    <div class="absolute top-4 left-4 z-20 pointer-events-none" style="display:none">
        <div class="glass-panel px-4 py-3 rounded-2xl max-w-xs shadow-2xl border-emerald-500/30">
            <div class="flex items-center gap-2 mb-1">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <h1 class="text-lg font-black tracking-wider text-white">坂、見えてますよ</h1>
                <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-500/40 px-1.5 py-0.5 rounded font-mono">AR VISTA</span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">
                ビル群に隠された都市の本来の地形（勾配）を透視。
            </p>
            <div class="mt-2 text-[11px] text-emerald-400/90 font-mono flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                <span>ドラッグ / スワイプで360°見回す</span>
            </div>
        </div>
    </div>

    <!-- 右上：AR状態ステータス -->
    <div class="absolute top-4 right-4 z-20 pointer-events-none hidden sm:block" style="display:none">
        <div class="glass-panel px-4 py-2.5 rounded-xl font-mono text-xs text-right space-y-1">
            <div class="text-slate-400">SENSOR: <span class="text-emerald-400">ONLINE</span></div>
            <div class="text-slate-400">MODE: <span class="text-emerald-400">X-RAY TERRAIN</span></div>
            <div class="text-slate-400">SLOPE DETECTED: <span class="text-emerald-400 font-bold" id="slope-value">+12.4%</span></div>
        </div>
    </div>

    <!-- 中央：スマートフォン型 ARレンズベゼル -->
    <div class="phone-container">
        <div class="phone-notch"></div>
        
        <div id="phone-screen" class="phone-screen">
            <!-- 照準(勾配の計測ポイント) -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 opacity-50">
                <div class="w-10 h-10 border border-emerald-400/60 rounded-full flex items-center justify-center">
                    <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full"></div>
                </div>
            </div>
            <!-- 実測勾配(地形データから計算) -->
            <div class="absolute bottom-5 left-0 right-0 text-center z-20 pointer-events-none">
                <span class="inline-block bg-black/70 border border-emerald-500/40 px-3 py-1 rounded-full text-[12px] font-mono text-emerald-300" id="hud-slope">勾配 --%</span>
            </div>
        </div>
    </div>

    <!-- 下部操作パネル -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3" style="display:none">
        <button id="btn-wire-color" class="glass-panel hover:bg-slate-800/80 text-white text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-2 pointer-events-auto active:scale-95">
            <span class="w-3 h-3 rounded-full bg-emerald-400 inline-block shadow-[0_0_8px_#00ff66]" id="color-dot"></span>
            <span>表示カラー切り替え</span>
        </button>
        <button id="btn-reset-view" class="glass-panel hover:bg-slate-800/80 text-white text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-2 pointer-events-auto active:scale-95">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span>正面に戻す</span>
        </button>
    </div>

    <!-- 機能パネル + クレジット -->
    <div id="feature-panel">
        <div style="font-weight:700; font-size:15px; margin-bottom:10px;">坂、見えてますよ</div>
        <label style="display:flex; justify-content:space-between; align-items:center; gap:8px; cursor:pointer; margin:10px 0;">
            <span>レンズをつかんで動かす</span>
            <input type="checkbox" id="tgl-lens" style="accent-color:#e8a13d; width:16px; height:16px;">
        </label>
        <button id="btn-front" style="width:100%; background:#f3e5cf; border:none; color:#6b5335; border-radius:12px; padding:8px 0; cursor:pointer; font-family:inherit; font-weight:700; font-size:12px;">視点をまっすぐに戻す</button>
        <hr style="border:none; border-top:1px dashed #dfc9a6; margin:14px 0;">
        <div style="font-size:11px; line-height:1.75; color:#8a6b3f;">
            つくったひと<br>
            <span style="color:#5c4a38; font-weight:700; font-size:14px;">猪原 大智</span>
        </div>
        <a href="https://inotai.net/about" target="_blank" rel="noopener"
           style="display:block; text-align:center; background:#e8a13d; color:#fff; font-weight:700; border-radius:12px; padding:9px 0; margin-top:10px; text-decoration:none; font-size:13px;">
            ポートフォリオを見る →
        </a>
    </div>

    <script>
        // --- 基本変数・設定 ---
        const canvas = document.getElementById('webgl-canvas');
        const phoneScreen = document.getElementById('phone-screen');
        const hudSlope = document.getElementById('hud-slope');

        let width = window.innerWidth;
        let height = window.innerHeight;

        // レンダラー設定
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = false; // 軽量化のため影は無効
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // --- 2つのシーン構成 ---
        // Scene 1: メインビュー（全画面：現実の街並み。建物で奥の坂が隠れている）
        const sceneMain = new THREE.Scene();
        // 都会の昼空色
        const skyColor = 0x87ceeb;
        sceneMain.background = new THREE.Color(skyColor);
        sceneMain.fog = new THREE.FogExp2(skyColor, 0.014);

        // Scene 2: ARビュー（スマホ内：背景黒、建物なし、緑のワイヤーフレーム地形のみ）
        const sceneAR = new THREE.Scene();
        sceneAR.background = new THREE.Color(0x020608);

        // 共有カメラ
        const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 400);
        // カメラ位置：地上1.6m（道路中央手前）
        const cameraBaseY = 1.6;
        camera.position.set(0, cameraBaseY, 20);

        // ビルの窓用テクスチャをCanvasで動的生成（街のディテールアップ）
        function createBuildingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // ベース壁色（昼の明るいビル）
            ctx.fillStyle = '#efe9dc';
            ctx.fillRect(0, 0, 512, 512);
            
            // 窓を描画
            const rows = 4;
            const cols = 5;
            const winW = 44;
            const winH = 52;
            const padX = (512 - (cols * winW)) / (cols + 1);
            const padY = (512 - (rows * winH)) / (rows + 1);

            for(let r = 0; r < rows; r++) {
                for(let c = 0; c < cols; c++) {
                    const x = padX + c * (winW + padX);
                    const y = padY + r * (winH + padY);
                    
                    // 昼間の窓（空を反射する色や暗い色）
                    const rand = Math.random();
                    if(rand > 0.8) {
                        ctx.fillStyle = '#64748b'; // ブラインドが下りているような色
                    } else if (rand > 0.4) {
                        ctx.fillStyle = '#475569'; // 少し暗めの反射
                    } else {
                        ctx.fillStyle = '#1e293b'; // 暗い窓
                    }
                    ctx.shadowBlur = 0;
                    ctx.fillRect(x, y, winW, winH);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            // フィルタリング設定で少しシャープにする
            texture.magFilter = THREE.NearestFilter;
            return texture;
        }

        function sampleRealTerrain(wx, wz) {
            const size = REAL_TERRAIN.size, step = REAL_TERRAIN.step, n = REAL_TERRAIN.n, hs = REAL_TERRAIN.heights;
            const dx = wz, dz = wx; // 回転: 画面の前方(-z) = データの西(団子坂の登り方向)
            const fx = (dx + size) / step, fz = (dz + size) / step;
            const ix = Math.max(0, Math.min(n - 2, Math.floor(fx)));
            const iz = Math.max(0, Math.min(n - 2, Math.floor(fz)));
            const tx = Math.min(1, Math.max(0, fx - ix));
            const tz = Math.min(1, Math.max(0, fz - iz));
            const h00 = hs[iz * n + ix], h10 = hs[iz * n + ix + 1];
            const h01 = hs[(iz + 1) * n + ix], h11 = hs[(iz + 1) * n + ix + 1];
            return (h00 * (1 - tx) + h10 * tx) * (1 - tz) + (h01 * (1 - tx) + h11 * tx) * tz;
        }

        function getTerrainHeight(x, z) {
            let h = 0;
            // 手前 (z > 5) は歩きやすい平坦地
            if (z < 5) {
                const dist = 5 - z;
                // 正面奥への登り坂（なだらかに調整）
                h += Math.pow(dist * 0.06, 1.4) * 1.8;
                // 左右の起伏・うねり（控えめに）
                h += Math.sin(x * 0.04) * Math.cos(z * 0.03) * 1.5;
                // 細かな地形ノイズ
                h += Math.sin(x * 0.1 + z * 0.1) * 0.5;
            } else {
                // 手前のわずかなグラデーション + 背後・左右のゆるい丘(振り返っても地形がある)
                h += Math.sin(x * 0.1) * 0.1;
                const ramp = Math.min(1, Math.max(0, (z - 5) / 25));
                h += ramp * (
                    12 * Math.exp(-((x * x) / (2 * 70 * 70) + ((z - 100) ** 2) / (2 * 40 * 40))) +  // 背後の丘(道が尾根越えして消える)
                    9  * Math.exp(-(((x - 95) ** 2) / (2 * 50 * 50) + ((z - 35) ** 2) / (2 * 55 * 55))) +  // 東の台地
                    8  * Math.exp(-(((x + 95) ** 2) / (2 * 50 * 50) + ((z - 30) ** 2) / (2 * 60 * 60)))     // 西の台地
                );
            }
            // 実在地形の質感をブレンド(カメラ周辺はなだらかに)
            const detailRamp = Math.min(1, Math.hypot(x, z - 20) / 45);
            h += sampleRealTerrain(x, z) * 0.35 * detailRamp;
            return h;
        }

        // --- 追加の道路網(初期画面の視界外・ビルの陰に配置。千駄木の道路パターンを参考) ---
        const extraRoads = [
            { axis: 'x', at: -28, from: -60, to: 60, width: 6 },   // 前方の交差道路(ほぼビルの陰)
            { axis: 'x', at: -58, from: -70, to: 70, width: 5 },
            { axis: 'x', at: 45,  from: -70, to: 70, width: 6 },   // 背後の交差道路
            { axis: 'z', at: -30, from: -90, to: 55, width: 5 },   // 西の並行裏道
            { axis: 'z', at: 30,  from: -90, to: 55, width: 4.5 }, // 東の裏道
            // 坂の上の街路網(正面奥)
            { axis: 'x', at: -40, from: -60, to: 60,  width: 4.5 },
            { axis: 'x', at: -72, from: -70, to: 70,  width: 5 },
            { axis: 'x', at: -90, from: -50, to: 50,  width: 4 },
            { axis: 'z', at: -15, from: -105, to: -30, width: 4 },
            { axis: 'z', at: -45, from: -100, to: -40, width: 5 },
            { axis: 'z', at: 45,  from: -95,  to: -35, width: 4.5 },
            { axis: 'z', at: 52,  from: -80,  to: -20, width: 3.5 },
            // 坂の上のへび道(西)
            { axis: 'z', at: -52, from: -40, to: -58, width: 3 },
            { axis: 'x', at: -58, from: -52, to: -62, width: 3 },
            { axis: 'z', at: -62, from: -58, to: -78, width: 3 },
            // 背後(南)側の道路網
            { axis: 'x', at: 30,  from: -70, to: 70,  width: 5 },
            { axis: 'x', at: 58,  from: -80, to: 80,  width: 8 },
            { axis: 'x', at: 82,  from: -60, to: 60,  width: 5 },
            { axis: 'z', at: -22, from: 25,  to: 108, width: 5 },
            { axis: 'z', at: 24,  from: 30,  to: 108, width: 4.5 },
            // へび道(東側・蛇行する路地)
            { axis: 'z', at: 44,  from: 20,  to: -6,  width: 3 },
            { axis: 'x', at: -6,  from: 44,  to: 56,  width: 3 },
            { axis: 'z', at: 56,  from: -6,  to: -34, width: 3 },
            { axis: 'x', at: -34, from: 56,  to: 66,  width: 3 },
        ];
        const stairRoads = [ // 正面の坂を登る階段(ビルの陰。ARで赤く見える)
            { axis: 'z', at: 15,  from: -32, to: -64, width: 2.2 },
            { axis: 'z', at: -20, from: -28, to: -52, width: 2.2 },
        ];

        function buildRibbon(axis, at, from, to, w, yOff, mat, scene) {
            if (from > to) { const t = from; from = to; to = t; }
            const len = to - from;
            const g = axis === 'z'
                ? new THREE.PlaneGeometry(w, len, 1, 60)
                : new THREE.PlaneGeometry(len, w, 60, 1);
            g.rotateX(-Math.PI / 2);
            const pp = g.attributes.position;
            for (let i = 0; i < pp.count; i++) {
                let x = pp.getX(i), z = pp.getZ(i);
                if (axis === 'z') { x += at; z += (from + to) / 2; }
                else { x += (from + to) / 2; z += at; }
                pp.setX(i, x); pp.setZ(i, z);
                pp.setY(i, getTerrainHeight(x, z) + yOff);
            }
            g.computeVertexNormals();
            const mesh = new THREE.Mesh(g, mat);
            scene.add(mesh);
            return mesh;
        }

        const extraRoadMat = new THREE.MeshStandardMaterial({ color: 0x4a4f54, roughness: 0.9 });
        const stairMat = new THREE.MeshStandardMaterial({ color: 0x8d939a, roughness: 0.9 });
        extraRoads.forEach(rd => buildRibbon(rd.axis, rd.at, rd.from, rd.to, rd.width, 0.14, extraRoadMat, sceneMain));
        stairRoads.forEach(rd => buildRibbon(rd.axis, rd.at, rd.from, rd.to, rd.width, 0.18, stairMat, sceneMain));
        buildRibbon('x', 58, -80, 80, 0.35, 0.24,
            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }), sceneMain);

        function overlapsExtra(x, z, margin) {
            const all = extraRoads.concat(stairRoads);
            return all.some(rd => {
                const lo = Math.min(rd.from, rd.to), hi = Math.max(rd.from, rd.to);
                const along = rd.axis === 'z' ? z : x;
                const across = rd.axis === 'z' ? x - rd.at : z - rd.at;
                return along > lo - margin && along < hi + margin &&
                       Math.abs(across) < rd.width / 2 + margin;
            });
        }

        // 2) ARビュー用地形メッシュ（緑のワイヤーフレーム＋半透明ベース）
        let wireframeColor = 0x00ff66;
        
        // ベースの暗い半透明面（立体感を出すため）
        const terrainBaseMatAR = new THREE.MeshBasicMaterial({
            color: 0x002211,
            transparent: true,
            opacity: 0.6,
            depthWrite: false
        });
        const terrainBaseAR = new THREE.Mesh(terrainGeo, terrainBaseMatAR);
        sceneAR.add(terrainBaseAR);

        // ワイヤーフレーム面
        const terrainMatAR = new THREE.MeshBasicMaterial({
            color: wireframeColor,
            wireframe: true,
            transparent: true,
            opacity: 0.85
        });
        const terrainAR = new THREE.Mesh(terrainGeo, terrainMatAR);
        sceneAR.add(terrainAR);

        // ARビュー: 大通りの縁ライン(足元±14mはカット=手前の太帯を防ぐ)
        {
            const eMat = new THREE.MeshBasicMaterial({ color: 0xbfffd9 });
            for (const side of [-1, 1]) {
                buildRibbon('z', side * roadWidth / 2, -110, 8, 0.5, 0.15, eMat, sceneAR);
                buildRibbon('z', side * roadWidth / 2, 34, 110, 0.5, 0.15, eMat, sceneAR);
            }
        }

        // ARビュー: 道路の半透明塗り(ネットワークが面として見える)
        const arFillMat = new THREE.MeshBasicMaterial({ color: 0x22b060, transparent: true, opacity: 0.55 });
        extraRoads.forEach(rd => buildRibbon(rd.axis, rd.at, rd.from, rd.to, rd.width, 0.13, arFillMat, sceneAR));
        buildRibbon('z', 0, -110, 8, roadWidth, 0.12, arFillMat, sceneAR);  // 大通り(足元はカット)
        buildRibbon('z', 0, 34, 110, roadWidth, 0.12, arFillMat, sceneAR);

        // ARビュー: 追加道路の縁ライン + 階段(赤)
        const arEdgeMat2 = new THREE.MeshBasicMaterial({ color: 0xbfffd9 });
        extraRoads.forEach(rd => {
            for (const side of [-1, 1]) {
                buildRibbon(rd.axis, rd.at + side * rd.width / 2, rd.from, rd.to, 0.4, 0.16, arEdgeMat2, sceneAR);
            }
        });
        const arStairMat = new THREE.MeshBasicMaterial({ color: 0xff7043 });
        stairRoads.forEach(rd => buildRibbon(rd.axis, rd.at, rd.from, rd.to, rd.width, 0.18, arStairMat, sceneAR));

        // ARビュー用：地形の下に標高グリッド補助線を追加
        const gridHelperAR = new THREE.GridHelper(200, 40, 0x004422, 0x002211);
        gridHelperAR.position.y = -2;
        sceneAR.add(gridHelperAR);


        // 建物群の生成（道路と歩道を挟んで密集して配置）
        const buildingGroup = new THREE.Group();
        
        // 基本のビルマテリアル群
        const buildingMaterials = [
            new THREE.MeshStandardMaterial({ color: 0xf3ecdd, roughness: 0.8, map: buildingTex }),
            new THREE.MeshStandardMaterial({ color: 0xd9cfc0, roughness: 0.7, map: buildingTex }),
            new THREE.MeshStandardMaterial({ color: 0xb9b3a6, roughness: 0.8, map: buildingTex })
        ];

        // 建物の配置パラメータ
        const startZ = 20;
        const endZ = -100;
        const stepZ = 8; // 低層住宅を密に
        const buildAreaStart = roadWidth / 2 + sidewalkWidth + 1; // 建物エリアの開始X

        // 道路の両側にビルを構築
        for (let z = startZ; z >= endZ; z -= stepZ) {
            for (let side of [-1, 1]) {
                // 各側に2列〜3列のビルを並べて街の奥行きを出す
                for (let col = 0; col < 3; col++) {
                    const bx = side * (buildAreaStart + col * 9 + Math.random() * 2);
                    const bz = z - Math.random() * 3;
                    if (overlapsExtra(bx, bz, 2.2)) continue;
                    
                    // ランダムなビル寸法 (3〜15階建て相当)
                    const bWidth = 5 + Math.random() * 4;
                    const bDepth = 5 + Math.random() * 4;
                    let bHeight = 6 + Math.random() * 5;
                    
                    // 奥に行くほど高いビルを配置して圧迫感を出す
                    if (bz < -30 && Math.random() > 0.75) bHeight += 6 + Math.random() * 5; // たまに小さめのマンション

                    const bGeo = new THREE.BoxGeometry(bWidth, bHeight, bDepth);
                    
                    // テクスチャリピート設定（ビルのサイズに合わせる）
                    const mat = buildingMaterials[Math.floor(Math.random() * buildingMaterials.length)].clone();
                    mat.map = mat.map.clone();
                    mat.map.repeat.set(Math.floor(bWidth/4), Math.floor(bHeight/4));
                    
                    const bMesh = new THREE.Mesh(bGeo, mat);
                    bMesh.castShadow = true;
                    bMesh.receiveShadow = true;

                    // 地形の高さに合わせて配置(斜面では四隅の最低点に基礎を置く)
                    const groundY = Math.min(
                        getTerrainHeight(bx - bWidth / 2, bz - bDepth / 2),
                        getTerrainHeight(bx + bWidth / 2, bz - bDepth / 2),
                        getTerrainHeight(bx - bWidth / 2, bz + bDepth / 2),
                        getTerrainHeight(bx + bWidth / 2, bz + bDepth / 2));
                    bMesh.position.set(bx, groundY + bHeight / 2 - 0.2, bz);

                    // 屋上設備（室外機など）
                    if (Math.random() > 0.3) {
                        const roofGeo = new THREE.BoxGeometry(bWidth * 0.4, 0.7, bDepth * 0.4);
                        const roofMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
                        const roofMesh = new THREE.Mesh(roofGeo, roofMat);
                        roofMesh.position.set(0, bHeight / 2 + 1, 0);
                        bMesh.add(roofMesh);
                    }

                    buildingGroup.add(bMesh);
                }
            }
        }

        // 背後・左右の街並み(初期画面の視界外を埋める)
        {
            const shared = buildingMaterials.map(m => {
                const mm = m.clone();
                mm.map = m.map.clone();
                mm.map.repeat.set(2, 3);
                mm.map.needsUpdate = true;
                return mm;
            });
            const corridorHalf = roadWidth / 2 + sidewalkWidth + 1;
            for (let gx = -90; gx <= 90; gx += 9) {
                for (let gz = -10; gz <= 95; gz += 9) {
                    if (Math.abs(gx) < corridorHalf + 4) continue;      // 大通りの回廊は空ける
                    if (Math.hypot(gx, gz - 20) < 14) continue;          // カメラ周辺
                    if (overlapsExtra(gx, gz, 2.2)) continue;
                    if (Math.random() < 0.25) continue;
                    const w = 6 + Math.random() * 5, d = 6 + Math.random() * 4;
                    const hgt = 9 + Math.random() * 14;
                    const b = new THREE.Mesh(new THREE.BoxGeometry(w, hgt, d),
                        shared[Math.floor(Math.random() * shared.length)]);
                    const bx = gx + (Math.random() - 0.5) * 2, bz = gz + (Math.random() - 0.5) * 2;
                    const gY = Math.min(
                        getTerrainHeight(bx - w / 2, bz - d / 2), getTerrainHeight(bx + w / 2, bz - d / 2),
                        getTerrainHeight(bx - w / 2, bz + d / 2), getTerrainHeight(bx + w / 2, bz + d / 2));
                    b.position.set(bx, gY + hgt / 2 - 0.2, bz);
                    buildingGroup.add(b);
                }
            }
            // 左右の外周(前方サイドの奥)
            for (let gx of [-52, -64, -78, 52, 64, 78]) {
                for (let gz = -95; gz <= -12; gz += 10) {
                    if (overlapsExtra(gx, gz, 2.2)) continue;
                    if (Math.random() < 0.3) continue;
                    const w = 7 + Math.random() * 5, d = 6 + Math.random() * 4;
                    const hgt = 10 + Math.random() * 16;
                    const b = new THREE.Mesh(new THREE.BoxGeometry(w, hgt, d),
                        shared[Math.floor(Math.random() * shared.length)]);
                    const gY2 = Math.min(
                        getTerrainHeight(gx - w / 2, gz - d / 2), getTerrainHeight(gx + w / 2, gz - d / 2),
                        getTerrainHeight(gx - w / 2, gz + d / 2), getTerrainHeight(gx + w / 2, gz + d / 2));
                    b.position.set(gx, gY2 + hgt / 2 - 0.2, gz);
                    buildingGroup.add(b);
                }
            }
        }
        // 坂の上の住宅地を補強(フランク列の外側)
        {
            const shared2 = buildingMaterials.map(m => {
                const mm = m.clone();
                mm.map = m.map.clone();
                mm.map.repeat.set(2, 3);
                mm.map.needsUpdate = true;
                return mm;
            });
            for (let gx of [-46, -38, 38, 46]) {
                for (let gz = -98; gz <= -28; gz += 10) {
                    if (overlapsExtra(gx, gz, 2.2)) continue;
                    if (Math.random() < 0.3) continue;
                    const w = 6 + Math.random() * 4, d = 6 + Math.random() * 3;
                    const hgt = 8 + Math.random() * 10;
                    const b = new THREE.Mesh(new THREE.BoxGeometry(w, hgt, d),
                        shared2[Math.floor(Math.random() * shared2.length)]);
                    const gY3 = Math.min(
                        getTerrainHeight(gx - w / 2, gz - d / 2), getTerrainHeight(gx + w / 2, gz - d / 2),
                        getTerrainHeight(gx - w / 2, gz + d / 2), getTerrainHeight(gx + w / 2, gz + d / 2));
                    b.position.set(gx, gY3 + hgt / 2 - 0.2, gz);
                    buildingGroup.add(b);
                }
            }
        }
        // 空いた区画を小さな家で充填(「道だけの区画」を無くす)
        {
            const infillMats = buildingMaterials.map(m => {
                const mm = m.clone();
                mm.map = m.map.clone();
                mm.map.repeat.set(1, 2);
                mm.map.needsUpdate = true;
                return mm;
            });
            const corridorClear = roadWidth / 2 + sidewalkWidth + 2;
            for (let gx = -84; gx <= 84; gx += 7) {
                for (let gz = -104; gz <= 100; gz += 7) {
                    if (Math.abs(gx) < corridorClear) continue;        // 大通りの回廊
                    if (Math.hypot(gx, gz - 20) < 14) continue;        // カメラ周辺
                    if (overlapsExtra(gx, gz, 2.4)) continue;          // 道路の上
                    if (Math.random() < 0.45) continue;                // 密度調整
                    const w = 3.5 + Math.random() * 2, d = 3.5 + Math.random() * 2;
                    const hgt = 5 + Math.random() * 5;
                    const b = new THREE.Mesh(new THREE.BoxGeometry(w, hgt, d),
                        infillMats[Math.floor(Math.random() * infillMats.length)]);
                    const bx = gx + (Math.random() - 0.5) * 2;
                    const bz = gz + (Math.random() - 0.5) * 2;
                    const gY = Math.min(
                        getTerrainHeight(bx - w / 2, bz - d / 2), getTerrainHeight(bx + w / 2, bz - d / 2),
                        getTerrainHeight(bx - w / 2, bz + d / 2), getTerrainHeight(bx + w / 2, bz + d / 2));
                    b.position.set(bx, gY + hgt / 2 - 0.2, bz);
                    buildingGroup.add(b);
                }
            }
        }
        sceneMain.add(buildingGroup);

        // メインシーンのライティング（昼間の太陽光と環境光）
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); // 全体を明るく照らす
        sceneMain.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 50, 0);
        sceneMain.add(hemiLight);

        // 太陽光のような指向性ライト
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(50, 100, 30);
        dirLight.castShadow = true;
        // シャドウマップの解像度と範囲を広げる
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 10;
        dirLight.shadow.camera.far = 200;
        const d = 80;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        // シャドウのぼかし
        dirLight.shadow.bias = -0.0005;
        sceneMain.add(dirLight);

        // カメラ初期位置のY座標を地形に合わせる
        camera.position.y = getTerrainHeight(0, 20) + cameraBaseY;

        // --- STREAMING_CHUNK:Camera Orbit Controls (Yaw/Pitch Drag)... ---
        // ドラッグ視点操作 (Yaw / Pitch)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let yaw = 0;   // 左右回転 (ラジアン)
        let pitch = 0; // 上下回転 (ラジアン)

        const maxPitch = THREE.MathUtils.degToRad(30); // ±30度に制限

        function onPointerDown(e) {
            if (lensMode && phoneContainer.contains(e.target)) return;
            isDragging = true;
            previousMousePosition = {
                x: e.clientX || (e.touches && e.touches[0].clientX) || 0,
                y: e.clientY || (e.touches && e.touches[0].clientY) || 0
            };
        }

        function onPointerMove(e) {
            if (lensDrag) return;
            if (!isDragging) return;

            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;

            const deltaX = clientX - previousMousePosition.x;
            const deltaY = clientY - previousMousePosition.y;

            yaw -= deltaX * 0.0035;
            pitch -= deltaY * 0.0035;

            // Pitch制限
            pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch));

            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerUp() {
            isDragging = false;
        }

        // イベントリスナーの登録
        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);


        // --- STREAMING_CHUNK:UI Interaction Logic... ---
        // 正面に戻すボタン
        document.getElementById('btn-reset-view').addEventListener('click', () => {
            yaw = 0;
            pitch = 0;
        });

        // ワイヤーフレーム色変更ボタン
        const colors = [
            { hex: 0x00ff66, css: '#00ff66' }, // ネオングリーン
            { hex: 0x00e5ff, css: '#00e5ff' }, // サイバーシアン
            { hex: 0xff3366, css: '#ff3366' }, // ネオンピンク
            { hex: 0xffc107, css: '#ffc107' }  // アンバー
        ];
        let colorIdx = 0;

        document.getElementById('btn-wire-color').addEventListener('click', () => {
            colorIdx = (colorIdx + 1) % colors.length;
            const c = colors[colorIdx];
            terrainMatAR.color.setHex(c.hex);
            document.getElementById('color-dot').style.backgroundColor = c.css;
            document.getElementById('color-dot').style.boxShadow = `0 0 8px ${c.css}`;
        });


        // --- STREAMING_CHUNK:Window Resize Handler... ---
        function onWindowResize() {
            width = window.innerWidth;
            height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        }
        window.addEventListener('resize', onWindowResize);


        // --- STREAMING_CHUNK:Dual-Pass Scissor Rendering Loop... ---
        /**
         * メインのアニメーションループ
         * 1パス目：全画面に `sceneMain` (通常街並み) を描画
         * 2パス目：スマホ画面枠だけにScissorで `sceneAR` (ワイヤーフレーム地形) を描画
         */
        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);

            // 1) カメラの回転更新
            camera.rotation.set(pitch, yaw, 0, 'YXZ');

            // 照準方向の勾配を地形データから実計算して表示
            frameCount++;
            if (frameCount % 8 === 0) {
                // スマホ(レンズ)の中心を通るレイで判定(レンズを動かしても照準どおりに反応)
                const prc = phoneScreen.getBoundingClientRect();
                const ndcX = ((prc.left + prc.width / 2) / width) * 2 - 1;
                const ndcY = -(((prc.top + prc.height / 2) / height) * 2 - 1);
                const dir = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera).sub(camera.position).normalize();
                let hit = null;
                const cp = camera.position;
                for (let d = 2; d < 160; d += 1) {
                    const x = cp.x + dir.x * d, z = cp.z + dir.z * d;
                    const y = cp.y + dir.y * d;
                    if (y <= getTerrainHeight(x, z)) { hit = { x, z }; break; }
                }
                if (hit) {
                    const hl = Math.hypot(dir.x, dir.z) || 1;
                    const h1 = getTerrainHeight(hit.x, hit.z);
                    const h2 = getTerrainHeight(hit.x + dir.x / hl * 12, hit.z + dir.z / hl * 12);
                    const grade = (h2 - h1) / 12 * 100;
                    // 照準の当たった点が階段の上にある時だけ警告(厳密判定)
                    const onStair = stairRoads.some(rd => {
                        const lo = Math.min(rd.from, rd.to), hi = Math.max(rd.from, rd.to);
                        const along = rd.axis === 'z' ? hit.z : hit.x;
                        const across = rd.axis === 'z' ? hit.x - rd.at : hit.z - rd.at;
                        return along > lo - 1 && along < hi + 1 && Math.abs(across) < rd.width / 2 + 1;
                    });
                    if (onStair) hudSlope.textContent = "⚠ ここには階段があります";
                    else hudSlope.textContent = `この先勾配 ${grade >= 0 ? "+" : ""}${grade.toFixed(0)}%`;
                } else {
                    hudSlope.textContent = "この先勾配 +0%";
                }
            }

            // === 1st Pass: メインビュー (全画面描画) ===
            renderer.setScissorTest(false);
            renderer.setViewport(0, 0, width, height);
            renderer.render(sceneMain, camera);

            // === 2nd Pass: スマホ画面枠 (Scissor テストによるクリッピング描画) ===
            const rect = phoneScreen.getBoundingClientRect();

            if (rect.width > 0 && rect.height > 0) {
                // WebGLのScissor領域は左下原点(Bottom-Left)基準
                // ※Three.jsのsetScissor/setViewportは内部で自動的にpixelRatioを乗算するため、
                // dprを掛けずにCSS論理ピクセルのまま渡す必要があります。
                const left = rect.left;
                const bottom = height - rect.bottom;
                const phoneW = rect.width;
                const phoneH = rect.height;

                renderer.setScissorTest(true);
                renderer.setScissor(left, bottom, phoneW, phoneH);
                renderer.setViewport(left, bottom, phoneW, phoneH);

                // ARシーンのレンダリング
                // setViewOffsetで「スマホの背後にある視野」だけを切り出して描く
                // (レンズを動かすと、その場所の地形が見える=本当の透視窓になる)
                camera.setViewOffset(width, height, rect.left, rect.top, rect.width, rect.height);
                renderer.render(sceneAR, camera);
                camera.clearViewOffset();
            }
        }

        // --- レンズ移動モード ---
        const phoneContainer = document.querySelector('.phone-container');
        let lensMode = false, lensDrag = false, lensStart = null, lensOff = { x: 0, y: 0 };
        document.getElementById('tgl-lens').addEventListener('change', e => {
            lensMode = e.target.checked;
            phoneContainer.style.pointerEvents = lensMode ? 'auto' : 'none';
            phoneContainer.style.cursor = lensMode ? 'grab' : '';
        });
        phoneContainer.addEventListener('pointerdown', e => {
            if (!lensMode) return;
            lensDrag = true;
            lensStart = { x: e.clientX - lensOff.x, y: e.clientY - lensOff.y };
        });
        window.addEventListener('pointermove', e => {
            if (!lensDrag) return;
            lensOff = { x: e.clientX - lensStart.x, y: e.clientY - lensStart.y };
            phoneContainer.style.transform = `translate(calc(-50% + ${lensOff.x}px), calc(-50% + ${lensOff.y}px))`;
        });
        window.addEventListener('pointerup', () => { lensDrag = false; });

        // --- 視点リセット ---
        document.getElementById('btn-front').addEventListener('click', () => {
            yaw = 0; pitch = 0;
            lensOff = { x: 0, y: 0 };
            phoneContainer.style.transform = 'translate(-50%, -50%)';
        });

        // 初期化実行
        window.onload = () => {
            onWindowResize();
            animate();
        };
    </script>
</body>
</html>
