<title>坂、見えてますよ - 千駄木実データデモ</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8dc;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  #app { position: fixed; inset: 0; cursor: grab; }
  #app:active { cursor: grabbing; }
  canvas { display: block; }

  /* スマホベゼル(縦持ち)。中身はWebGLのシザー描画 */
  #phone {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(300px, 74vw); height: min(600px, 74vh);
    border: 12px solid #1a1c20; border-radius: 40px;
    box-shadow: 0 22px 50px rgba(0,0,0,.5), inset 0 0 0 2px rgba(0,0,0,.85);
    pointer-events: none; z-index: 10; box-sizing: border-box;
  }
  #phone .notch {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: 84px; height: 18px; background: #1a1c20; border-radius: 10px; z-index: 12;
  }
  #phone .place {
    position: absolute; top: 34px; left: 0; right: 0; text-align: center; z-index: 12;
    font-family: ui-monospace, monospace; font-size: 10px; color: #7dffb8; opacity: .9;
  }
  #phone .place span { background: rgba(0,0,0,.55); border: 1px solid rgba(0,255,120,.35);
    border-radius: 999px; padding: 2px 10px; }
  #phone .cross {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 40px; height: 40px; border: 1px solid rgba(60,255,140,.55); border-radius: 50%;
    z-index: 12; opacity: .6;
  }
  #phone .cross::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 5px; height: 5px; background: #3cff8c; border-radius: 50%;
  }
  #hud-slope-wrap {
    position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; z-index: 12;
  }
  #hud-slope {
    font-family: ui-monospace, monospace; font-size: 12px; color: #9dffc7;
    background: rgba(0,0,0,.6); border: 1px solid rgba(0,255,120,.4);
    border-radius: 999px; padding: 4px 12px;
  }
  #hud-warn {
    display: none; margin-top: 6px; font-size: 10px; color: #ffb27d;
    font-family: ui-monospace, monospace;
  }

  /* 機能パネル(紙風) */
  #feature-panel {
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
    width: 230px; z-index: 30;
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", sans-serif;
    background: #fdf6ea; color: #5c4a38;
    border: 1px solid #ecd9bd; border-radius: 22px;
    box-shadow: 0 10px 30px rgba(90, 60, 20, .18);
    padding: 18px; font-size: 12px; line-height: 1.6;
  }
  @media (max-width: 640px) {
    #feature-panel { right: 8px; left: 8px; top: auto; bottom: 10px; transform: none; width: auto; }
  }
  #feature-panel .ttl { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  #feature-panel .chip { font-size: 10px; background: #f6e3c1; color: #8a6b3f;
    border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
  #feature-panel label { display: flex; justify-content: space-between; align-items: center;
    gap: 8px; cursor: pointer; margin: 9px 0; }
  #feature-panel input[type=checkbox] { accent-color: #e8a13d; width: 16px; height: 16px; }
  #feature-panel button { width: 100%; background: #f3e5cf; border: none; color: #6b5335;
    border-radius: 12px; padding: 8px 0; cursor: pointer; font-family: inherit;
    font-weight: 700; font-size: 12px; }
  #feature-panel hr { border: none; border-top: 1px dashed #dfc9a6; margin: 12px 0; }
  #feature-panel .credit { font-size: 11px; color: #8a6b3f; }
  #feature-panel .credit b { color: #5c4a38; font-size: 14px; }
  #feature-panel a.pf { display: block; text-align: center; background: #e8a13d; color: #fff;
    font-weight: 700; border-radius: 12px; padding: 9px 0; margin-top: 8px;
    text-decoration: none; font-size: 13px; }

  #attrib {
    position: fixed; left: 10px; bottom: 8px; z-index: 20;
    font-size: 10px; color: #4b5563; background: rgba(255,255,255,.65);
    border-radius: 8px; padding: 3px 8px;
  }
</style>

<script type="importmap">

<script type="module">
import * as THREE from "three";

// ---------- 標高サンプラ(千駄木の実測地形・バイリニア補間) ----------
function sampleH(x, z) {
  const { size, step, n, heights } = TERRAIN;
  const fx = (x + size) / step, fz = (z + size) / step;
  const ix = Math.max(0, Math.min(n - 2, Math.floor(fx)));
  const iz = Math.max(0, Math.min(n - 2, Math.floor(fz)));
  const tx = Math.min(1, Math.max(0, fx - ix));
  const tz = Math.min(1, Math.max(0, fz - iz));
  const h00 = heights[iz * n + ix], h10 = heights[iz * n + ix + 1];
  const h01 = heights[(iz + 1) * n + ix], h11 = heights[(iz + 1) * n + ix + 1];
  return (h00 * (1 - tx) + h10 * tx) * (1 - tz) + (h01 * (1 - tx) + h11 * tx) * tz;
}

// ---------- レンダラーと2つのシーン ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.getElementById("app").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe8ee);
scene.fog = new THREE.Fog(0xdfe8ee, 90, 320);

const arScene = new THREE.Scene();
arScene.background = new THREE.Color(0x01070a);

// ---------- 地形 ----------
function makeTerrain(material) {
  const g = new THREE.PlaneGeometry(TERRAIN.size * 2, TERRAIN.size * 2, 160, 160);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, sampleH(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  return new THREE.Mesh(g, material);
}
scene.add(makeTerrain(new THREE.MeshLambertMaterial({ color: 0x9fa89c })));
const arBase = makeTerrain(new THREE.MeshBasicMaterial({ color: 0x03140b }));
arBase.position.y -= 0.25;
arScene.add(arBase);
arScene.add(makeTerrain(new THREE.MeshBasicMaterial({ color: 0x00d96a, wireframe: true, transparent: true, opacity: 0.5 })));

// ---------- 道路(OSM実データ→リボン化して1ジオメトリに結合) ----------
function buildRoadGeometry(filter, yOff) {
  const pos = [];
  for (const rd of ROADS) {
    if (!filter(rd)) continue;
    const w = Math.max(1.6, rd.w);
    const pts = rd.pts;
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, z1] = pts[i], [x2, z2] = pts[i + 1];
      const dx = x2 - x1, dz = z2 - z1;
      const len = Math.hypot(dx, dz);
      if (len < 0.05) continue;
      const nx = (-dz / len) * w / 2, nz = (dx / len) * w / 2;
      const steps = Math.max(1, Math.ceil(len / 5));
      for (let s = 0; s < steps; s++) {
        const t1 = s / steps, t2 = (s + 1) / steps;
        const ax = x1 + dx * t1, az = z1 + dz * t1;
        const bx = x1 + dx * t2, bz = z1 + dz * t2;
        const quad = [
          [ax - nx, az - nz], [ax + nx, az + nz], [bx - nx, bz - nz],
          [ax + nx, az + nz], [bx + nx, bz + nz], [bx - nx, bz - nz],
        ];
        for (const [px, pz] of quad) pos.push(px, sampleH(px, pz) + yOff, pz);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  return g;
}
const isSteps = rd => rd.hw === "steps";
// 実景: 車道・路地はアスファルト、階段は明るいグレー
scene.add(new THREE.Mesh(buildRoadGeometry(rd => !isSteps(rd), 0.15),
  new THREE.MeshBasicMaterial({ color: 0x41464b })));
scene.add(new THREE.Mesh(buildRoadGeometry(isSteps, 0.18),
  new THREE.MeshBasicMaterial({ color: 0x8d939a })));
// AR: 道は緑、階段は赤(自転車の敵)
arScene.add(new THREE.Mesh(buildRoadGeometry(rd => !isSteps(rd), 0.35),
  new THREE.MeshBasicMaterial({ color: 0x2bff88, transparent: true, opacity: 0.85 })));
const arSteps = new THREE.Mesh(buildRoadGeometry(isSteps, 0.4),
  new THREE.MeshBasicMaterial({ color: 0xff7043 }));
arScene.add(arSteps);

// ---------- 建物(OSM実データ→押し出して1ジオメトリに結合) ----------
{
  const pos = [], col = [];
  const palette = [
    [0.95, 0.93, 0.87], [0.86, 0.82, 0.76], [0.76, 0.73, 0.68],
    [0.9, 0.88, 0.84], [0.82, 0.79, 0.71], [0.7, 0.72, 0.74],
  ];
  for (const b of BLDS) {
    try {
      const shape = new THREE.Shape();
      b.pts.forEach(([x, z], i) => (i ? shape.lineTo(x, -z) : shape.moveTo(x, -z)));
      let geo = new THREE.ExtrudeGeometry(shape, { depth: b.h, bevelEnabled: false });
      geo.rotateX(-Math.PI / 2);
      let cx = 0, cz = 0;
      b.pts.forEach(([x, z]) => { cx += x; cz += z; });
      cx /= b.pts.length; cz /= b.pts.length;
      geo.translate(0, sampleH(cx, cz) - 0.4, 0);
      if (geo.index) geo = geo.toNonIndexed();
      const a = geo.attributes.position.array;
      const c = palette[Math.floor(Math.random() * palette.length)];
      for (let i = 0; i < a.length; i += 3) {
        pos.push(a[i], a[i + 1], a[i + 2]);
        col.push(c[0], c[1], c[2]);
      }
    } catch (e) { /* 不正なポリゴンはスキップ */ }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })));
}

// ---------- ライト ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f8a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(60, 120, 40);
scene.add(sun);

// ---------- カメラ(団子坂下に立つ。位置固定・向きだけ操作) ----------
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 900);
camera.position.set(0, sampleH(0, 10) + 1.7, 10);
let yaw = 0, pitch = 0;
const maxPitch = THREE.MathUtils.degToRad(35);

let isDragging = false, px = 0, py = 0;
function pDown(e) {
  if (lensMode && phone.contains(e.target)) return;
  isDragging = true;
  px = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
  py = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
}
function pMove(e) {
  if (lensDrag || !isDragging) return;
  const cx = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
  const cy = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
  yaw -= (cx - px) * 0.0035;
  pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch - (cy - py) * 0.0035));
  px = cx; py = cy;
}
addEventListener("mousedown", pDown); addEventListener("mousemove", pMove);
addEventListener("mouseup", () => isDragging = false);
addEventListener("touchstart", pDown, { passive: true });
addEventListener("touchmove", pMove, { passive: true });
addEventListener("touchend", () => isDragging = false);

// ---------- レンズ移動 ----------
const phone = document.getElementById("phone");
let lensMode = false, lensDrag = false, lensStart = null, lensOff = { x: 0, y: 0 };
document.getElementById("tgl-lens").addEventListener("change", e => {
  lensMode = e.target.checked;
  phone.style.pointerEvents = lensMode ? "auto" : "none";
  phone.style.cursor = lensMode ? "grab" : "";
});
phone.addEventListener("pointerdown", e => {
  if (!lensMode) return;
  lensDrag = true;
  lensStart = { x: e.clientX - lensOff.x, y: e.clientY - lensOff.y };
});
addEventListener("pointermove", e => {
  if (!lensDrag) return;
  lensOff = { x: e.clientX - lensStart.x, y: e.clientY - lensStart.y };
  phone.style.transform = `translate(calc(-50% + ${lensOff.x}px), calc(-50% + ${lensOff.y}px))`;
});
addEventListener("pointerup", () => lensDrag = false);

// ---------- ジャイロ(スマホ実機) ----------
let gyroOn = false;
function onGyro(e) {
  if (!gyroOn || e.alpha == null) return;
  yaw = -THREE.MathUtils.degToRad(e.alpha);
  pitch = Math.max(-maxPitch, Math.min(maxPitch, THREE.MathUtils.degToRad((e.beta ?? 90) - 90)));
}
document.getElementById("tgl-gyro").addEventListener("change", async e => {
  if (e.target.checked) {
    try {
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        if (await DeviceOrientationEvent.requestPermission() !== "granted") {
          e.target.checked = false; return;
        }
      }
      addEventListener("deviceorientation", onGyro);
      gyroOn = true;
    } catch { e.target.checked = false; }
  } else gyroOn = false;
});

document.getElementById("btn-front").addEventListener("click", () => {
  yaw = 0; pitch = 0;
  lensOff = { x: 0, y: 0 };
  phone.style.transform = "translate(-50%, -50%)";
});

// ---------- HUD: 照準方向の実勾配 + 階段警告 ----------
const hudSlope = document.getElementById("hud-slope");
const hudWarn = document.getElementById("hud-warn");
function nearSteps(x, z, r) {
  for (const rd of ROADS) {
    if (rd.hw !== "steps") continue;
    for (const [sx, sz] of rd.pts) {
      if ((sx - x) ** 2 + (sz - z) ** 2 < r * r) return true;
    }
  }
  return false;
}

// ---------- 描画ループ(1パス目=実景全画面、2パス目=スマホ枠に透視ビュー) ----------
let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  camera.rotation.set(pitch, yaw, 0, "YXZ");

  frame++;
  if (frame % 8 === 0) {
    const dir = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
    let hit = null;
    for (let d = 3; d < 260; d += 1.5) {
      const x = camera.position.x + dir.x * d, z = camera.position.z + dir.z * d;
      if (camera.position.y + dir.y * d <= sampleH(x, z)) { hit = { x, z }; break; }
    }
    if (hit) {
      const hl = Math.hypot(dir.x, dir.z) || 1;
      const h1 = sampleH(hit.x, hit.z);
      const h2 = sampleH(hit.x + dir.x / hl * 6, hit.z + dir.z / hl * 6);
      const grade = (h2 - h1) / 6 * 100;
      hudSlope.textContent = `この先の勾配 ${grade >= 0 ? "+" : ""}${grade.toFixed(1)}%`;
      hudWarn.style.display = nearSteps(hit.x, hit.z, 18) ? "block" : "none";
    } else {
      hudSlope.textContent = "勾配 --%";
      hudWarn.style.display = "none";
    }
  }

  const W = innerWidth, H = innerHeight;
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, W, H);
  renderer.render(scene, camera);

  const r = phone.getBoundingClientRect();
  const left = r.left + 12, top = r.top + 12;
  const w = r.width - 24, h = r.height - 24;
  if (w > 0 && h > 0) {
    renderer.setScissorTest(true);
    renderer.setScissor(left, H - top - h, w, h);
    renderer.setViewport(left, H - top - h, w, h);
    camera.setViewOffset(W, H, left, top, w, h);
    renderer.render(arScene, camera);
    camera.clearViewOffset();
  }
}
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});
animate();
</script>
